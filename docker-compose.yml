version: "3.9"

services:
  app:
    build: .
    ports:
      - "${PORT:-3010}:3010"
    environment:
      - PORT=3010
      - DB_PATH=/app/data/app.db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
